{% component quote_display(id: string, text: string) %}
{% set data = load_data(path="quotes/" ~ id ~ ".toml") %}
{% set pool = data.pool %}
{% set holder_id = "quote-holder-" ~ id %}
<blockquote id="{{ holder_id }}" class="quote-display">
  <p>{{ text }}</p>
  <footer></footer>
</blockquote>
<script>
(() => {
  const target = document.getElementById({{ holder_id | json_encode() | safe }});
  const entries = {{ pool | json_encode() | safe }};
  target.addEventListener("click", () => {
    const entry = entries[Math.floor(Math.random() * entries.length)];
    target.querySelector("p").innerHTML = entry.text;
    const dash = entry.source.charCodeAt(0) < 256 ? "— " : "——";
    target.querySelector("footer").innerHTML = dash + entry.source;
  });
})();
</script>
{% endcomponent %}
