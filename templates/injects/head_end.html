<script>
    window.zolaTheme.katex.init = function () {
        if (window.TikzcdKaTeX) {
            window.TikzcdKaTeX.installTikzcd(katex);
            window.TikzcdKaTeX.setTikzcdStyle({
                "row sep": 2.7,
                "column sep": 3.6
            });
        }

        window.renderMathInElement(document.body, {
            delimiters: [
                { left: "$$", right: "$$", display: true },
                { left: "$", right: "$", display: false },
            ],
            throwOnError: false,
        })
    }
</script>
