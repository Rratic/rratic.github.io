{% set id = "shell-" ~ nth %}
{% if nth == 1 %}
<script>
	function touch_shell(id) {
		let node = document.getElementById(id);
		node.classList.toggle("folded");
	}
</script>
{% endif %}
<blockquote class="folder" onclick="touch_shell('{{ id | safe }}')">
	{{ text | markdown | safe }}
</blockquote>
<div id="{{ id }}" class="folded">
	{{ body | markdown | safe }}
</div>
